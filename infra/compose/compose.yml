# JupyterLab для уроков и сервисы курса.
#   make lab M=00                      — JupyterLab модуля → http://localhost:8888
#   make services S="qdrant postgres"  — поднять сервисы (профили)
#   make services-down                 — остановить всё
name: mlcourse

services:
  lab:
    build: ../docker/runtime
    image: mlcourse/runtime:latest
    working_dir: /course/${MODULE:-modules/M00-setup}
    command:
      - bash
      - -c
      - >-
        uv sync --quiet &&
        JUPYTER_PATH=$$UV_PROJECT_ENVIRONMENT/share/jupyter
        uv run --no-sync jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
        --IdentityProvider.token='' --ServerApp.password=''
    environment:
      UV_PROJECT_ENVIRONMENT: /venvs/${MODULE_NAME:-M00-setup}  # Linux-окружение отдельно от .venv на Mac
      UV_CACHE_DIR: /cache/uv
      LLM_CACHE_DIR: /cache/llm
    ports:
      - "127.0.0.1:8888:8888"  # только локально: JupyterLab без пароля
    volumes:
      - ../..:/course
      - venvs:/venvs
      - cache:/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Ollama на хосте (нужно для Linux)

  # Версии образов сервисов фиксируются в модулях, где сервисы появляются впервые.
  qdrant:
    image: qdrant/qdrant:latest
    profiles: [qdrant]
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant:/qdrant/storage

  postgres:
    image: pgvector/pgvector:pg17
    profiles: [postgres]
    environment:
      POSTGRES_USER: course
      POSTGRES_PASSWORD: course
      POSTGRES_DB: course
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: [redis]
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  venvs:
  cache:
  qdrant:
  postgres:
