[project]
name = "m02-classic-ml"
version = "1.0.0"
description = "M02. Классическое ML"
requires-python = "==3.12.*"
dependencies = [
    "mlcourse",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
    "pytest>=8",
    "numpy>=2.0",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scikit-learn>=1.6",
    "catboost>=1.2",
    "shap>=0.46",
    "umap-learn>=0.5",
]

[tool.uv]
package = false
# Платформы курса: Mac на Apple Silicon (нативно) и Linux (Docker, CI, WSL2 на Windows).
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

[tool.uv.sources]
mlcourse = { path = "../../shared", editable = true }

[tool.pytest.ini_options]
testpaths = ["exercises/tests"]
