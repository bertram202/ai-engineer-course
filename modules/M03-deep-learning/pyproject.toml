[project]
name = "m03-deep-learning"
version = "1.0.0"
description = "M03. Нейросети, PyTorch и CV"
requires-python = "==3.12.*"
dependencies = [
    "mlcourse",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
    "pytest>=8",
    "torch>=2.8",
    "torchvision>=0.23",
    "timm>=1.0",
    "transformers>=4.56",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "pillow>=11",
    "scikit-learn>=1.6",
]

[tool.uv]
package = false
# Платформы курса: Mac на Apple Silicon (нативно) и Linux (Docker, CI, WSL2 на Windows).
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
]

[tool.uv.sources]
mlcourse = { path = "../../shared", editable = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

# На Linux (CI, Docker) — CPU-сборка PyTorch: без CUDA она в разы меньше.
# На Mac — обычные колёса с поддержкой MPS.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["exercises/tests"]
