[project]
name = "mlcourse"
version = "0.1.0"
description = "Общая библиотека курса «AI-инженер: от устройства LLM до мультиагентных систем»"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.28",
    "numpy>=2.0",
    "openai>=1.100",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
langchain = ["langchain-openai>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlcourse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
