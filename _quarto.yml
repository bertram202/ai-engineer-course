project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - modules/*/theory/theory.qmd
    - modules/*/theory/cheatsheet.qmd
    - modules/*/lessons/*/lesson.ipynb

lang: ru

execute:
  freeze: auto

website:
  title: "AI-инженер"
  description: "Курс «AI-инженер: от устройства LLM до мультиагентных систем»"
  site-url: https://bertram202.github.io/ai-engineer-course
  repo-url: https://github.com/bertram202/ai-engineer-course
  repo-actions: [issue]
  search:
    location: sidebar
  navbar:
    left:
      - text: "О курсе"
        href: index.qmd
    right:
      - icon: github
        href: https://github.com/bertram202/ai-engineer-course
  sidebar:
    style: docked
    contents:
      - section: "M00 · Старт"
        contents:
          - modules/M00-setup/theory/theory.qmd
          - modules/M00-setup/theory/cheatsheet.qmd
          - modules/M00-setup/lessons/01-environment/lesson.ipynb
          - modules/M00-setup/lessons/02-docker/lesson.ipynb
          - modules/M00-setup/lessons/03-models/lesson.ipynb
          - modules/M00-setup/lessons/04-opencode/lesson.ipynb
      - section: "M01 · Математика для LLM"
        contents:
          - modules/M01-math/theory/theory.qmd
          - modules/M01-math/theory/cheatsheet.qmd
          - modules/M01-math/lessons/01-linear-algebra/lesson.ipynb
          - modules/M01-math/lessons/02-gradients/lesson.ipynb
          - modules/M01-math/lessons/03-probability/lesson.ipynb
      - section: "M02 · Классическое ML"
        contents:
          - modules/M02-classic-ml/theory/theory.qmd
          - modules/M02-classic-ml/theory/cheatsheet.qmd
          - modules/M02-classic-ml/lessons/01-validation/lesson.ipynb
          - modules/M02-classic-ml/lessons/02-linear-models/lesson.ipynb
          - modules/M02-classic-ml/lessons/03-boosting/lesson.ipynb
          - modules/M02-classic-ml/lessons/04-unsupervised/lesson.ipynb
      - section: "M03 · Нейросети, PyTorch и CV"
        contents:
          - modules/M03-deep-learning/theory/theory.qmd
          - modules/M03-deep-learning/theory/cheatsheet.qmd
          - modules/M03-deep-learning/lessons/01-micrograd/lesson.ipynb
          - modules/M03-deep-learning/lessons/02-pytorch/lesson.ipynb
          - modules/M03-deep-learning/lessons/03-vision/lesson.ipynb
          - modules/M03-deep-learning/lessons/04-embeddings/lesson.ipynb
      - section: "M04 · NLP и Hugging Face"
        contents:
          - modules/M04-nlp/theory/theory.qmd
          - modules/M04-nlp/theory/cheatsheet.qmd
          - modules/M04-nlp/lessons/01-baselines/lesson.ipynb
          - modules/M04-nlp/lessons/02-huggingface/lesson.ipynb
          - modules/M04-nlp/lessons/03-finetune-vs-llm/lesson.ipynb
  page-footer:
    left: "AI-инженер: от устройства LLM до мультиагентных систем"
    right: "Тексты — CC BY-NC-SA 4.0 · Код — MIT"

format:
  html:
    theme:
      light: [cosmo, quarto/html/theme.scss]
      dark: [darkly, quarto/html/theme.scss, quarto/html/theme-dark.scss]
    toc: true
    toc-title: "На странице"
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    other-links-title: "Скачать"
  pdf:
    pdf-engine: xelatex
    documentclass: scrartcl
    papersize: a4
    fontsize: 11pt
    mainfont: PT Serif
    sansfont: PT Sans
    monofont: PT Mono
    monofontoptions: [Scale=0.9, HyphenChar=None]
    geometry: [top=24mm, bottom=26mm, left=24mm, right=22mm]
    toc: true
    toc-depth: 2
    toc-title: "Содержание"
    number-sections: true
    colorlinks: true
    linkcolor: mlaccent
    urlcolor: mlaccent
    highlight-style: github
    include-in-header: quarto/latex/preamble.tex
